{% set name = "zope.sqlalchemy" %}
{% set version = "4.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/zope_sqlalchemy-{{ version }}.tar.gz
  sha256: fcf33370f33df8b03a03b3abe99803e9ef6c17664fb721b8d11d1c0f50851ef6

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - packaging
    - setuptools
    - sqlalchemy >=1.1,!=1.4.0,!=1.4.1,!=1.4.2,!=1.4.3,!=1.4.4,!=1.4.5,!=1.4.6
    - transaction >=1.6.0
    - zope.interface >=3.6.0

test:
  imports:
    - zope
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/zopefoundation/zope.sqlalchemy
  summary: Minimal Zope/SQLAlchemy transaction integration
  license: ZPL-2.1 AND BSD-3-Clause
  license_file:
    - COPYRIGHT.txt
    - LICENSE.txt

extra:
  recipe-maintainers:
    - ChrisBarker-NOAA
